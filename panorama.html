<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panorama Fábrica — Usina Bela Vista Argamassas</title>
<style>:root{--bg:#f3f5f9;--card:#fff;--bd:#e1e5ec;--tx:#1d2433;--dim:#6b7385;--pri:#16467a;--pri2:#2468b0;--ok:#16915a;--okbg:#e6f6ee;--warn:#b7791f;--warnbg:#fdf3dc;--bad:#c8372d;--badbg:#fdeceb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 "Segoe UI",Arial,sans-serif}
header{background:var(--pri);color:#fff;padding:14px 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:18px}nav{display:flex;gap:6px}
nav a{color:#fff;text-decoration:none;padding:8px 14px;border-radius:8px;background:rgba(255,255,255,.14);font-weight:600;font-size:14px}
nav a.on{background:#fff;color:var(--pri)}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:16px;color:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label{display:block;font-size:12px;font-weight:600;color:var(--dim);margin-bottom:4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:#fff}
input:focus,select:focus{outline:2px solid var(--pri2);border-color:var(--pri2)}
button{font:inherit;font-weight:700;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;background:var(--pri);color:#fff}
button.sec{background:#e9edf4;color:var(--tx)}button.ok{background:var(--ok)}button.bad{background:var(--bad)}button.sm{padding:6px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.b-ni{background:#e9edf4;color:var(--dim)}.b-ea{background:var(--warnbg);color:var(--warn)}.b-co{background:var(--okbg);color:var(--ok)}
.msg{padding:10px 12px;border-radius:8px;margin-top:10px;font-weight:600;display:none}
.msg.ok{display:block;background:var(--okbg);color:var(--ok)}.msg.err{display:block;background:var(--badbg);color:var(--bad)}
.empty{color:var(--dim);padding:8px 0}
.maq{border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
.maq h3{margin:0 0 8px;font-size:15px}
.item{border-top:1px solid var(--bd);padding:10px 0}.item:first-of-type{border-top:0}
.item .t{font-weight:700}.item .s{color:var(--dim);font-size:13px;margin-top:2px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px}
.kpi .v{font-size:28px;font-weight:800;color:var(--pri);line-height:1.1}.kpi .l{font-size:12px;color:var(--dim);margin-top:4px;font-weight:600}
.kpi.g .v{color:var(--ok)}.kpi.r .v{color:var(--bad)}
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.mc{border:1px solid var(--bd);border-radius:12px;padding:14px;background:#fff;border-top:5px solid #c5ccd8}
.mc.prod{border-top-color:var(--ok);background:#f6fcf9}.mc.wait{border-top-color:var(--warn)}.mc.done{border-top-color:var(--pri2)}.mc.stop{border-top-color:var(--bad);background:#fff7f6}
.mc h3{margin:0 0 6px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.mc .p{font-weight:700;font-size:13px}.mc .s{font-size:12.5px;color:var(--dim);margin-top:3px}
.bar{height:8px;background:#e9edf4;border-radius:4px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.rsw{margin-top:10px;padding-top:8px;border-top:1px dashed var(--bd)}.rs{font-size:12px;color:var(--tx);margin-top:2px}.rl{color:var(--dim);margin-top:1px}.late{color:var(--bad);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--dim);font-size:12px;text-transform:uppercase;padding:6px}td{padding:8px 6px;border-top:1px solid var(--bd)}
.scroll{overflow-x:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:800px){.two{grid-template-columns:1fr}}
.hb{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}.hb span.n{width:130px;flex:none}.hb .b{flex:1;height:10px;background:#e9edf4;border-radius:5px;overflow:hidden}.hb .b i{display:block;height:100%;background:var(--pri2)}.hb .b i.red{background:var(--bad)}
.top{display:flex;gap:10px;align-items:center;color:#fff;font-size:13px}
.brand{display:flex;align-items:center;gap:12px}.logo{background:#fff;border-radius:10px;padding:5px 12px;display:flex;align-items:center}.logo img{height:38px;width:auto;display:block}#lock .lg{height:48px;margin-bottom:10px}</style><link rel="icon" href="/logo.png"></head><body>
<header><div class="brand"><span class="logo"><img src="/logo.png" alt="Bela Vista"></span><h1>Usina Bela Vista Argamassas · Panorama Fábrica</h1></div>
<div class="top"><span id="upd">Carregando…</span></div></header>
<main>
<div class="row" style="justify-content:space-between;margin-bottom:12px"><h2 style="margin:0;color:var(--pri)" id="titulo">Panorama de hoje</h2>
<div class="row"><input type="date" id="dia" style="width:auto"><button class="sec sm" id="hoje">Hoje</button></div></div>
<div class="kpis" id="kpis"></div>
<div class="card"><h2>Situação das máquinas</h2><div class="mg" id="maq"></div></div>
<div class="card"><h2>Programação do dia</h2><div class="scroll" id="prog"></div></div>
<div class="two">
<div class="card"><h2>Próximos 7 dias <span style="font-weight:400;color:var(--dim);font-size:12px">sacos programados</span></h2><div id="prox"></div></div>
<div class="card"><h2>Paradas do dia <span style="font-weight:400;color:var(--dim);font-size:12px">horas por motivo</span></h2><div id="par"></div></div>
</div>
<div class="card"><h2>Acumulado do mês</h2><div class="kpis" id="mes" style="margin:0"></div></div>
</main>
<script>
const MAQUINAS=["Máquina 00","Máquina 01","Máquina 02","Máquina 03","Máquina 04","Máquina 05","Máquina 06"];
const $=id=>document.getElementById(id);
const brNow=()=>new Date(Date.now()-3*3600000);
const hojeStr=()=>brNow().toISOString().slice(0,10);
const agoraMin=()=>{const d=brNow();return d.getUTCHours()*60+d.getUTCMinutes()};
const toMin=h=>{if(!h)return null;const [a,b]=h.split(':').map(Number);return a*60+b};
const fmtD=d=>d.split('-').reverse().join('/');
const fmtN=n=>(n==null?0:Number(n)).toLocaleString('pt-BR');
const fmtH=h=>h.toFixed(1).replace('.',',')+' h';
const TURNOS=["1º Turno","2º Turno","3º Turno"];
function turnoDe(x){if(x.turno)return x.turno;const h=parseInt((x.inicioPrevisto||'').split(':')[0],10);if(isNaN(h))return '';return h>=6&&h<14?'1º Turno':h>=14&&h<22?'2º Turno':'3º Turno'}
let prog=[],par=[];
$('dia').value=hojeStr();
async function carregar(){
  try{const j=await (await fetch('/api/prog-data',{cache:'no-store'})).json();if(j.error)throw new Error(j.error);
    prog=j.programacao||[];par=j.paradas||[];render();$('upd').textContent='Atualizado às '+new Date().toLocaleTimeString('pt-BR')}
  catch(e){$('upd').textContent='Falha ao atualizar'}
}
function kpi(v,l,c){return `<div class="kpi ${c||''}"><div class="v">${v}</div><div class="l">${l}</div></div>`}

function resumoMaquina(m,dia,ativoId){
  const todos=prog.filter(x=>x.maquina===m);
  const k=x=>(x.data||'')+' '+(x.inicioPrevisto||'00:00');
  const ant=todos.filter(x=>x.status==='Concluído'&&k(x)<=dia+' 99:99').sort((a,b)=>k(b).localeCompare(k(a)))[0];
  const prox=todos.filter(x=>x.status==='Não iniciado'&&x.data>=dia&&x.id!==ativoId).sort((a,b)=>k(a).localeCompare(k(b))).slice(0,3);
  let h='';
  h+='<div class="rs"><b>Anterior:</b> '+(ant?`${ant.produto} — ${fmtN(ant.qtdProduzida)} sacos${ant.data!==dia?' ('+fmtD(ant.data).slice(0,5)+')':''}`:'–')+'</div>';
  h+='<div class="rs"><b>Próximas:</b> '+(prox.length?'':'–')+'</div>'+prox.map(x=>`<div class="rs rl">• ${x.produto} — ${fmtN(x.qtdProgramada)} (${turnoDe(x).replace(' Turno','T')})${x.data!==dia?' ('+fmtD(x.data).slice(0,5)+')':''}</div>`).join('');
  return '<div class="rsw">'+h+'</div>';
}
function render(){
  const dia=$('dia').value,eHoje=dia===hojeStr();
  $('titulo').textContent=(eHoje?'Panorama de hoje · ':'Panorama de ')+fmtD(dia);
  const its=prog.filter(x=>x.data===dia),ps=par.filter(x=>x.data===dia);
  const progQ=its.reduce((s,x)=>s+(x.qtdProgramada||0),0);
  const conc=its.filter(x=>x.status==='Concluído');
  const prodQ=conc.reduce((s,x)=>s+(x.qtdProduzida||0),0);
  const progConc=conc.reduce((s,x)=>s+(x.qtdProgramada||0),0);
  const horasPar=ps.reduce((s,x)=>s+(x.horasParadas||0),0);
  const nProd=MAQUINAS.filter(m=>its.some(x=>x.maquina===m&&x.status==='Em andamento')).length;
  const aderencia=progConc>0?prodQ/progConc*100:null;
  $('kpis').innerHTML=kpi(fmtN(progQ),'Sacos programados no dia')+kpi(fmtN(prodQ),'Sacos produzidos (ordens concluídas)','g')+
    kpi(progQ?Math.round(prodQ/progQ*100)+'%':'–','Realizado sobre o programado')+
    kpi(aderencia==null?'–':aderencia.toFixed(0)+'%','Aderência das ordens concluídas')+
    kpi(nProd+' de '+MAQUINAS.length,'Máquinas em produção agora')+
    kpi(fmtH(horasPar),'Horas paradas no dia',horasPar>0?'r':'');
  // máquinas
  const agora=agoraMin();
  $('maq').innerHTML=MAQUINAS.map(m=>{
    const l=its.filter(x=>x.maquina===m).sort((a,b)=>(a.inicioPrevisto||'').localeCompare(b.inicioPrevisto||''));
    const ativo=l.find(x=>x.status==='Em andamento');
    const parM=ps.filter(x=>x.maquina===m).reduce((s,x)=>s+(x.horasParadas||0),0);
    const parTxt=parM>0?`<div class="s">Paradas no dia: ${fmtH(parM)}</div>`:'';
    if(!l.length)return `<div class="mc"><h3>${m}<span class="badge b-ni">Sem programação</span></h3>${parTxt}${resumoMaquina(m,dia,null)}</div>`;
    const pm=l.reduce((s,x)=>s+(x.qtdProgramada||0),0),pr=l.filter(x=>x.status==='Concluído').reduce((s,x)=>s+(x.qtdProduzida||0),0);
    const pct=Math.min(100,pm?pr/pm*100:0);
    const bar=`<div class="bar"><i style="width:${pct}%"></i></div><div class="s">${fmtN(pr)} de ${fmtN(pm)} sacos (${l.filter(x=>x.status==='Concluído').length}/${l.length} ordens)</div>`;
    if(ativo){
      const f=toMin(ativo.terminoPrevisto),atr=eHoje&&f!=null&&agora>f;
      return `<div class="mc prod"><h3>${m}<span class="badge b-ea">Em produção</span></h3><div class="p">${ativo.produto}</div>
      <div class="s">${turnoDe(ativo).replace(' Turno','T')} · ${fmtN(ativo.qtdProgramada)} sacos · início ${ativo.inicioReal||'--:--'} · previsto até ${ativo.terminoPrevisto||'--:--'}${atr?' <span class="late">· atrasada</span>':''}</div>${bar}${parTxt}${resumoMaquina(m,dia,ativo.id)}</div>`;
    }
    const prox=l.find(x=>x.status==='Não iniciado');
    if(prox){
      const i=toMin(prox.inicioPrevisto),atr=eHoje&&i!=null&&agora>i;
      return `<div class="mc wait"><h3>${m}<span class="badge b-ni">Aguardando</span></h3><div class="p">Próxima: ${prox.produto}</div>
      <div class="s">${turnoDe(prox).replace(' Turno','T')} · ${fmtN(prox.qtdProgramada)} sacos · previsto ${prox.inicioPrevisto||'--:--'}${atr?' <span class="late">· início atrasado</span>':''}</div>${bar}${parTxt}${resumoMaquina(m,dia,prox.id)}</div>`;
    }
    return `<div class="mc done"><h3>${m}<span class="badge b-co">Concluído</span></h3><div class="p">Programação do dia finalizada</div>${bar}${parTxt}${resumoMaquina(m,dia,null)}</div>`;
  }).join('');
  // tabela
  const ord=its.slice().sort((a,b)=>turnoDe(a).localeCompare(turnoDe(b))||(a.inicioPrevisto||'').localeCompare(b.inicioPrevisto||'')||a.maquina.localeCompare(b.maquina));
  $('prog').innerHTML=ord.length?'<table><tr><th>Turno</th><th>Máquina</th><th>Produto</th><th>Programado</th><th>Previsto</th><th>Real</th><th>Produzido</th><th>Status</th></tr>'+ord.map(x=>
    `<tr><td>${turnoDe(x).replace(' Turno','T')}</td><td>${x.maquina}</td><td>${x.produto}</td><td>${fmtN(x.qtdProgramada)}</td><td>${x.inicioPrevisto||'--:--'} – ${x.terminoPrevisto||'--:--'}</td><td>${x.inicioReal?x.inicioReal+' – '+(x.terminoReal||'…'):'–'}</td><td>${x.status==='Concluído'?fmtN(x.qtdProduzida):'–'}</td>
    <td><span class="badge ${x.status==='Concluído'?'b-co':x.status==='Em andamento'?'b-ea':'b-ni'}">${x.status}</span></td></tr>`).join('')+'</table>':'<div class="empty">Nenhuma programação para este dia.</div>';
  // próximos 7 dias
  const dias=[];for(let i=0;i<7;i++){const d=new Date(dia+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+i);dias.push(d.toISOString().slice(0,10))}
  const tot=dias.map(d=>prog.filter(x=>x.data===d).reduce((s,x)=>s+(x.qtdProgramada||0),0));const mx=Math.max(...tot,1);
  $('prox').innerHTML=dias.map((d,i)=>`<div class="hb"><span class="n">${fmtD(d).slice(0,5)}</span><div class="b"><i style="width:${tot[i]/mx*100}%"></i></div><b>${fmtN(tot[i])}</b></div>`).join('');
  // paradas por motivo
  const pm={};ps.forEach(x=>{const k=x.motivo||'Sem motivo';pm[k]=(pm[k]||0)+(x.horasParadas||0)});
  const arr=Object.entries(pm).sort((a,b)=>b[1]-a[1]),mp=arr.length?arr[0][1]:1;
  $('par').innerHTML=arr.length?arr.map(([k,h])=>`<div class="hb"><span class="n">${k}</span><div class="b"><i class="red" style="width:${h/mp*100}%"></i></div><b>${fmtH(h)}</b></div>`).join(''):'<div class="empty">Nenhuma parada registrada neste dia.</div>';
  // mês
  const mk=dia.slice(0,7),mi=prog.filter(x=>x.data&&x.data.startsWith(mk)),mc=mi.filter(x=>x.status==='Concluído');
  const mProd=mc.reduce((s,x)=>s+(x.qtdProduzida||0),0),mProg=mi.reduce((s,x)=>s+(x.qtdProgramada||0),0);
  const mPar=par.filter(x=>x.data&&x.data.startsWith(mk)).reduce((s,x)=>s+(x.horasParadas||0),0);
  $('mes').innerHTML=kpi(fmtN(mProg),'Sacos programados no mês')+kpi(fmtN(mProd),'Sacos produzidos no mês','g')+kpi(mc.length+' de '+mi.length,'Ordens concluídas')+kpi(fmtH(mPar),'Horas paradas no mês',mPar>0?'r':'');
}
$('dia').onchange=render;$('hoje').onclick=()=>{$('dia').value=hojeStr();render()};
carregar();setInterval(carregar,30000);
</script></body></html>
